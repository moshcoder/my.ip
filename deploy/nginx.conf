# my.ip on dev3 (the box with IPv6): /etc/nginx/sites-available/my.ip
#
# my.ip.pit.world has its own A + AAAA at Porkbun pointing here, overriding the
# *.pit.world wildcard (dev2, v4 only), because a relay on a v4-only box can
# never see anyone's v6. 4.* is A only, 6.* is AAAA only.

upstream myip { server 127.0.0.1:8797; keepalive 8; }

server {
    listen 80;
    listen [::]:80;
    server_name my.ip.pit.world 4.my.ip.pit.world 6.my.ip.pit.world my.ip;

    # Our own certbot answers from this webroot. Anything else is pit.world's cert
    # sweep on dev2 (it sees my.ip in the registry and asks for my.ip.pit.world);
    # hand that to dev2 so the sweep succeeds instead of failing every hour.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri @pitworld;
    }
    location @pitworld {
        proxy_pass http://23.95.228.174;
        proxy_set_header Host $host;
    }

    # Plain http answers too: curl without -L or https still gets the addresses,
    # and Moshpit clients reaching `my.ip` have no public CA to check against.
    location / {
        proxy_pass http://myip;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name my.ip.pit.world 4.my.ip.pit.world 6.my.ip.pit.world;

    ssl_certificate     /etc/letsencrypt/live/my.ip.pit.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my.ip.pit.world/privkey.pem;

    access_log off;

    location / {
        proxy_pass http://myip;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
